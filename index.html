<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Friends of Dune Allen</title>
  <style>
    :root {
      --paper: #fdfcfa;
      --navy: #10334a;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      background: var(--paper);
      color: var(--navy);
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2.5rem 1.25rem;
    }

    main {
      width: min(36rem, 100%);
      text-align: center;
    }

    img {
      display: block;
      width: 100%;
      height: auto;
    }

    h1 {
      margin: 0.85rem 0 0;
      font-family: "Avenir Next", "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif;
      font-size: 0.875rem;
      font-weight: 500;
      letter-spacing: 0.34em;
      text-indent: 0.34em;
      line-height: 1.4;
      color: var(--navy);
    }
  </style>
</head>
<body>
  <main>
    <img src="images/logo.png" width="1247" height="430" alt="Friends of Dune Allen">
    <h1>COMING SOON</h1>
  </main>
</body>
</html>
